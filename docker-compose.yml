services:

  ai-production-support:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-production-support

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - app_data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


volumes:

  app_data: